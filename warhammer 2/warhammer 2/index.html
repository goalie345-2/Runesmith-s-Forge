<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runesmith's Forge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <p class="site-title">Runesmith's Forge</p>
  </header>

  <main>

    <!-- LEFT SIDE -->
    <section class="left">

      <h1>
        <label for="search">Search</label>
        <input type="search" id="search" name="search" placeholder="Search runes">
      </h1>

      <h2>
        <label for="filter">Filter</label>
        <select id="filter" name="filter">
          <option>All tags</option>
          <option>Armor</option>
          <option>Banner</option>
          <option>Talisman</option>
          <option>Shield</option>
          <option>Master</option>
        </select>
      </h2>

      <!-- Runes / Combos buttons (radio buttons styled as buttons, no JavaScript needed) -->
      <input type="radio" name="view" id="view-runes" checked>
      <input type="radio" name="view" id="view-combos">
      <div class="buttons">
        <label for="view-runes">Runes</label>
        <label for="view-combos">Combos</label>
      </div>

      <div class="window">
        <ul class="panel runes-panel">
          <li><strong>Rune placeholder</strong></li>
          <li><strong>Rune placeholder</strong></li>
          <li><strong>Rune placeholder</strong></li>
          <li><strong>Rune placeholder</strong></li>
          <li><strong>Rune placeholder</strong></li>
          <li><strong>Rune placeholder</strong></li>
        </ul>

        <ul class="panel combos-panel">
          <li><strong>Combo placeholder</strong></li>
          <li><strong>Combo placeholder</strong></li>
          <li><strong>Combo placeholder</strong></li>
        </ul>
      </div>

    </section>

    <!-- RIGHT SIDE -->
    <aside class="right">
      <h3>Build</h3>

      <div class="cross">
        <div class="square banner">Banner</div>
        <div class="square weapon">Weapon</div>
        <div class="square talisman">Talisman</div>
        <div class="square shield">Shield</div>
        <div class="square armor">Armor</div>
      </div>
    </aside>

  </main>

</body>
</html>
